{% extends 'base.html' %}
{% block title %}Voter profile{% endblock %}
{% block content %}
<div class="card" style="max-width:540px;">
    <h1>Voter</h1>
    <table>
        <tr>
            <th>Username</th>
            <td>{{ profile.user.username }}</td>
        </tr>
        <tr>
            <th>Student ID</th>
            <td>{{ profile.student_id }}</td>
        </tr>
        <tr>
            <th>Department</th>
            <td>{{ profile.department|default:'—' }}</td>
        </tr>
        <tr>
            <th>Verified</th>
            <td>{{ profile.is_verified|yesno:'Yes,No' }}</td>
        </tr>
    </table>
    <p style="margin-top:1rem;">
        <a class="btn" href="{% url 'voter_update' profile.pk %}">Edit</a>
        <a class="btn btn-secondary" href="{% url 'manage_voters' %}">Back</a>
    </p>
</div>
{% endblock %}
