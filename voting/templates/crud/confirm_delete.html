{% extends 'base.html' %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
    <h1>Delete {{ object }}?</h1>
    <p>This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a class="btn btn-secondary" href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancel</a>
    </form>
</div>
{% endblock %}
